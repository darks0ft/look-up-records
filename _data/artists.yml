# The Look Up Records roster, in display order (current first, then alumni).
# key:      matches `artist_key` on releases in _releases/
# page:     artist page on this site (null if there's no page; `post` is used instead)
# post:     the best post about the artist when there's no artist page
# image:    square-ish photo used on /artists and the homepage
# teaser_url: old Squarespace URL for this artist's teaser (redirects to /artists#key)
- key: darksoft
  name: Darksoft
  status: current
  genre: Dream pop, shoegaze
  location: Portland, Maine
  page: /darksoft
  image: /assets/img/darksoft-less-is-more-fe7a34.webp
  website: https://www.darksoft.band
  bandcamp: https://darks0ft.bandcamp.com/
  spotify: https://open.spotify.com/artist/5pD33SUgX5GQ8NvqZ6IdeE
  teaser_url: /artists/banadu
  blurb: Darksoft is a multi-instrumentalist songwriter and producer. Darksoft songs blend shoegaze and dream pop with lush melodic progressions, 80s/90s alternative rock undertones, and velvety vocals.
