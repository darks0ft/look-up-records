andrea-paz:
  bio: Andrea Paz is a writer, visual artist, and wanna-be musician. She enjoys the sweet melodies of shoegaze and  if she were a music genre, she'd be "dream pop." Besides music writing, she writes poetry and prose and lives in Seattle.
  image: /assets/img/andrea-paz-e35254.webp
  name: Andrea Paz
avril-carrillo:
  bio: null
  image: null
  name: Avril Carrillo
chris-goossens:
  bio: Chris Goossens is a journalist from Massachusetts. Additionally, he is a web designer and graphic artist. In Chris’ free time, he travels with his girlfriend Sarah, runs two YouTube channels, plays basketball, and participates in philanthropic ventures
  image: /assets/img/chris-goosens-3704e4.webp
  name: Chris Goossens
daniel-mathia:
  bio: You can catch Daniel Mathia at your local live show wearing a big gray jacket with dress shoes and round glasses. And just standing their with a straight look on his face because of how happy he is seeing live music. If he’s not at a concert then he’s probably at home working on his music blog The Wandering Ear or eating a hamburger/pancakes in some random restaurant in Seattle. Or you can catch him with his headphones listening and perfecting his playlists that he makes for The Wandering Ear a music blog that he created.
  image: /assets/img/daniel-mathia-63c136.webp
  name: Daniel Mathia
darksoft:
  bio: Darksoft is the founder of Look Up Records. He manages the label and blog, organizes Look Up Fest, handles PR, and scouts new music. His personal project is [Darksoft](/darksoft).
  image: /assets/img/b-insert-9e1dcc.webp
  name: Darksoft
eric-turner:
  bio: Eric Turner is a freelance writer that has contributed to the Look Up blog.
  image: /assets/img/eric-turner-5fa9aa.webp
  name: Eric Turner
iris-lux:
  bio: Iris Lux is a writer, DJ, and librarian living in Seattle. A queerdo pop culture nerd, she likes to write about music, gender, and monsters. Previously she’s written for Bust and other music blogs. Check out her blog at <http://lavenderfist.wordpress.com/>
  image: /assets/img/iris-lux-8b178e.webp
  name: Iris Lux
joel-h:
  bio: Joel H resides in St.Louis. 48 year old Earther 🌍. Recovering record store Manager of 15 years. Pandemic stay at home Dad. Ponderer of peace for a better tomorrow. Professional winker & a grin ;)
  image: /assets/img/joel-h-3f9b9b.webp
  name: Joel H
