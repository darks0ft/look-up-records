ryan-brum:
  bio: Ryan Brum helps with A&R, curating Look Up playlists, designing artwork, and assisting Look Up events. Ryan also plays in Seattle-based SWYM, a project released by Look Up Records.
  image: /assets/img/ryan-0bdc76.webp
  name: Ryan Brum
timothy-obrien:
  bio: 'Timothy O’Brien is an interdisciplinary artist specializing in music composition, writing, and visual arts in Portland, Oregon. Timothy has self-published multiple literary works, and premiered music and visual art throughout the Pacific Northwest.


    Website: [www.timothyarlissobrien.com](http://www.timothyarlissobrien.com/)


    Soundcloud: [timothyarlissobrien](https://soundcloud.com/timothyarlissobrien)


    Twitter: [adorableinpdx](https://twitter.com/adorableinpdx)'
