<footer class="site-footer">
  <section class="signup">
    <h2>Get the newsletter</h2>
    <p>New releases, shows, and label news.</p>
    {% include newsletter-form.html %}
  </section>
  <nav aria-label="Footer">
    <a href="/about">About</a>
    <a href="/code-of-conduct">Code of Conduct</a>
    <a href="/feed.xml">RSS</a>
    {% for link in site.social.links %}<a href="{{ link }}" rel="me">{{ link | split: '//' | last | split: '/' | first | remove: 'www.' | remove: '.com' }}</a>{% endfor %}
  </nav>
  <p class="small">© {{ 'now' | date: '%Y' }} Look Up Records</p>
</footer>
